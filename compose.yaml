services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: medlink_app

    env_file:
      - .env

    ports:
      - "8001:8000"

    environment:
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: medlink
      DB_USERNAME: root
      DB_PASSWORD: root
      VIEW_COMPILED_PATH: /var/www/storage/framework/views

    depends_on:
      - mysql

    networks:
      - medlink_network

  mysql:
    image: mysql:8.0

    container_name: medlink_mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: medlink
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - medlink_network

networks:
  medlink_network:

volumes:
  mysql_data: